name: Build Native (arm64-v8a)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  ndk-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install NDK
        run: |
          curl -fsSL "https://dl.google.com/android/repository/android-ndk-r26c-linux.zip" -o ndk.zip
          unzip -q ndk.zip -d "$RUNNER_TEMP/ndk"
          NDK_DIR="$(find "$RUNNER_TEMP/ndk" -maxdepth 1 -mindepth 1 -type d | head -n 1)"
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Run ndk-build
        run: |
          "$NDK_HOME/ndk-build" \
            -C "$GITHUB_WORKSPACE/jni" \
            NDK_PROJECT_PATH="$GITHUB_WORKSPACE" \
            APP_BUILD_SCRIPT="$GITHUB_WORKSPACE/jni/Android.mk" \
            NDK_APPLICATION_MK="$GITHUB_WORKSPACE/jni/Application.mk" \
            APP_ABI=arm64-v8a \
            -j"$(nproc)"

      - name: Upload native libraries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: minecraftpe-libs-arm64-v8a
          path: |
            libs/arm64-v8a/*.so
            obj/local/arm64-v8a/*.so
