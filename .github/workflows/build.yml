name: Build Native (arm64-v8a)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  ndk-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install NDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses > /dev/null
          sdkmanager --sdk_root="$SDK_ROOT" --install "ndk;26.1.10909125"
          echo "NDK_HOME=$SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Run ndk-build
        run: |
          "$NDK_HOME/ndk-build" \
            -C "$GITHUB_WORKSPACE/jni" \
            NDK_PROJECT_PATH="$GITHUB_WORKSPACE" \
            APP_BUILD_SCRIPT="$GITHUB_WORKSPACE/jni/Android.mk" \
            NDK_APPLICATION_MK="$GITHUB_WORKSPACE/jni/Application.mk" \
            APP_ABI=arm64-v8a \
            -j"$(nproc)"

      - name: Upload native libraries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: minecraftpe-libs-arm64-v8a
          path: |
            libs/arm64-v8a/*.so
            obj/local/arm64-v8a/*.so
