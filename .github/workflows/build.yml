name: Build Native (arm64-v8a)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  ndk-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: "26.1.10909125"
          build-tools-version: "30.0.3"
          api-level: 30

      - name: Run ndk-build
        run: |
          NDK_BUILD="$ANDROID_NDK_HOME/ndk-build"
          "$NDK_BUILD" \
            -C "$GITHUB_WORKSPACE/jni" \
            NDK_PROJECT_PATH="$GITHUB_WORKSPACE" \
            APP_BUILD_SCRIPT="$GITHUB_WORKSPACE/jni/Android.mk" \
            NDK_APPLICATION_MK="$GITHUB_WORKSPACE/jni/Application.mk" \
            APP_ABI=arm64-v8a \
            -j"$(nproc)"

      - name: Upload native libraries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: minecraftpe-libs-arm64-v8a
          path: |
            libs/arm64-v8a/*.so
            obj/local/arm64-v8a/*.so
